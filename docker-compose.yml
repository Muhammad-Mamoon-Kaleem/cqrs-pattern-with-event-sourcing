version: "3.9"

services:

  app:
    build: .
    container_name: cqrs-app

    ports:
      - "4000:4000"

    env_file:
      - .env

    depends_on:
      - postgres
      - mongo

    restart: unless-stopped

  postgres:
    image: postgres:17

    container_name: cqrs-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 786666
      POSTGRES_DB: cqrs_demo

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo:
    image: mongo:8

    container_name: cqrs-mongo

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:

  mongo_data: