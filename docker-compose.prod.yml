version: "3.9"

services:

  app:

    image: cqrs-app:latest

    container_name: cqrs-backend

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "4000:4000"

    env_file:
      - .env.production

    depends_on:
      postgres:
        condition: service_healthy

    restart: always

    networks:
      - backend-network


  postgres:

    image: postgres:16-alpine

    container_name: cqrs-postgres

    restart: always

    environment:

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      POSTGRES_DB: ${POSTGRES_DB}


    ports:

      - "5432:5432"


    volumes:

      - postgres-data:/var/lib/postgresql/data


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}"
        ]

      interval: 10s

      timeout: 5s

      retries: 5


    networks:
      - backend-network



volumes:

  postgres-data:


networks:

  backend-network:

    driver: bridge